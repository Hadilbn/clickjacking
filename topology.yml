name: library-clickjacking-cupcakes

hosts:
  # Student workstation: SEED Ubuntu VM (replaces the Kali host of the junior-hacker template).
  # !! Adapt "image" and "mgmt_user" to the SEED image registered in YOUR cloud / CyberRangeCZ.
  - name: seed
    base_box:
      image: seed-ubuntu-20.04
      mgmt_user: ubuntu
    flavor: m1.medium

routers:
  - name: router
    base_box:
      image: debian-12-x86_64
      mgmt_user: debian
    flavor: m1.small   # !! change if this flavor does not exist in your cloud

wan:
  name: internet-connection
  cidr: 100.100.100.0/24

networks:
  - name: seed-switch
    cidr: 10.1.27.0/24

net_mappings:
  - host: seed
    network: seed-switch
    ip: 10.1.27.10

router_mappings:
  - router: router
    network: seed-switch
    ip: 10.1.27.1

groups: []
